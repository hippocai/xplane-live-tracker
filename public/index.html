<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>X-Plane Live Tracker</title>
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- 无飞行/未连接提示条（设计文档 §6.6.2） -->
    <div id="status-banner" class="banner"></div>

    <!-- 地图容器 -->
    <div id="map"></div>

    <!-- 首次访问引导：局域网地址 + 二维码（F10，可折叠） -->
    <details id="lan-box" class="panel" open>
      <summary>📱 其它设备扫码 / 打开</summary>
      <div id="lan-list" class="lan-list"></div>
    </details>

    <!-- 悬浮信息面板（F6） -->
    <div id="info-panel" class="panel">
      <div class="info-title">✈ <span id="i-tail">--</span></div>
      <div class="info-grid">
        <div><label>高度 MSL</label><b id="i-alt">--</b></div>
        <div><label>离地 AGL</label><b id="i-agl">--</b></div>
        <div><label>地速</label><b id="i-gs">--</b></div>
        <div><label>指示空速</label><b id="i-ias">--</b></div>
        <div><label>航向</label><b id="i-hdg">--</b></div>
        <div><label>垂直速度</label><b id="i-vs">--</b></div>
        <div><label>经纬度</label><b id="i-pos">--</b></div>
        <div><label>数据延迟</label><b id="i-delay">--</b></div>
      </div>
    </div>

    <!-- 悬浮按钮 -->
    <div class="fabs">
      <button id="recenter-btn" class="fab" title="回到飞机位置">🎯</button>
      <button id="settings-btn" class="fab" title="设置">⚙</button>
      <button id="layers-btn" class="fab" title="导航图层">🧭</button>
    </div>

    <!-- 导航图层开关弹层 -->
    <div id="layers-panel" class="layers-pop panel" hidden>
      <div class="layers-title">导航图层</div>
      <label class="radio-row">
        <input type="checkbox" id="layer-airport" checked />
        <span
          ><svg width="15" height="15" viewBox="0 0 22 22">
            <circle cx="11" cy="11" r="9.5" fill="#1565c0" stroke="#ffffff" stroke-width="2.5" />
            <text
              x="11"
              y="15.5"
              text-anchor="middle"
              font-size="11"
              fill="#ffffff"
              font-family="sans-serif"
            >
              ✈
            </text>
          </svg>
          机场</span
        >
      </label>
      <label class="radio-row">
        <input type="checkbox" id="layer-navaid" checked />
        <span
          ><svg width="14" height="14" viewBox="0 0 19 19">
            <polygon
              points="9.5,1.5 16.6,5.6 16.6,13.4 9.5,17.5 2.4,13.4 2.4,5.6"
              fill="#7b1fa2"
              stroke="#ffffff"
              stroke-width="2.2"
            />
          </svg>
          导航台（VOR/NDB）</span
        >
      </label>
      <label class="radio-row">
        <input type="checkbox" id="layer-fix" />
        <span
          ><svg width="12" height="12" viewBox="0 0 14 14">
            <rect
              x="4"
              y="4"
              width="6"
              height="6"
              transform="rotate(45 7 7)"
              fill="#ef6c00"
              stroke="#ffffff"
              stroke-width="1.8"
            />
          </svg>
          航路点</span
        >
      </label>
      <div id="nav-layer-status" class="hint">
        数据来自本机 X-Plane 导航数据库（设置中可配置目录）；放大到 9 级以上显示机场名称
      </div>
    </div>

    <!-- 通讯模式设置面板（§6.4） -->
    <div id="settings-panel" class="drawer" hidden>
      <div class="drawer-head">
        <h3>设置</h3>
        <button id="settings-close" class="icon-btn" title="关闭">✕</button>
      </div>

      <section class="drawer-section">
        <label class="radio-row">
          <input type="radio" name="mode" value="webapi" />
          <span>X-Plane Web API（推荐，需 12.1.1+）</span>
        </label>
        <div class="mode-params" id="webapi-params">
          <div class="field-row">
            <label for="webapi-host">Host</label>
            <input
              id="webapi-host"
              type="text"
              value="127.0.0.1"
              placeholder="127.0.0.1"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="field-row">
            <label for="webapi-port">Port</label>
            <input
              id="webapi-port"
              type="number"
              min="1"
              max="65535"
              value="8086"
              placeholder="8086"
            />
          </div>
        </div>

        <label class="radio-row">
          <input type="radio" name="mode" value="udp" />
          <span>UDP 广播（兼容旧版本）</span>
        </label>
        <div class="mode-params" id="udp-params">
          <div class="field-row">
            <label for="udp-port">监听端口</label>
            <input
              id="udp-port"
              type="number"
              min="1"
              max="65535"
              value="49005"
              placeholder="49005"
            />
          </div>
          <p class="hint">请确认已在 X-Plane 的 Settings → Data Output 中将数据发送到本机此端口</p>
        </div>
      </section>

      <section class="drawer-section">
        <div class="conn-line">连接状态：<span id="conn-indicator">🔴 未连接</span></div>
        <div class="conn-line">最近数据：<span id="conn-last">--</span></div>
      </section>

      <section class="drawer-section">
        <div class="conn-line">地图</div>
        <label class="radio-row">
          <input type="checkbox" id="opt-baidu-auto" checked />
          <span>进入中国大陆自动切换百度地图</span>
        </label>
        <label class="radio-row">
          <input type="checkbox" id="opt-follow" checked />
          <span>地图跟随飞机位置</span>
        </label>
      </section>

      <section class="drawer-section">
        <div class="conn-line">导航数据（图层）</div>
        <div class="field-row">
          <label for="nav-xplane-path">X-Plane 目录</label>
          <input
            id="nav-xplane-path"
            type="text"
            placeholder="留空自动探测"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="hint" id="nav-data-status">--</div>
        <div class="drawer-actions">
          <button id="nav-apply" class="btn-primary">应用</button>
        </div>
      </section>

      <div class="drawer-actions">
        <button id="settings-save" class="btn-primary">保存并切换</button>
        <button id="settings-cancel" class="btn-plain">取消</button>
        <div id="settings-error" class="error"></div>
      </div>
    </div>

    <!-- 访问口令输入层（§9，启用 ACCESS_TOKEN 时出现） -->
    <div id="auth-overlay" class="auth-overlay" hidden>
      <div class="auth-card">
        <h3>访问口令</h3>
        <p class="hint">本服务已启用访问口令，请输入后继续</p>
        <input id="auth-token" type="password" placeholder="访问口令" autocomplete="off" />
        <div id="auth-error" class="error"></div>
        <button id="auth-submit" class="btn-primary">进入</button>
      </div>
    </div>

    <div id="toast" hidden></div>

    <script src="/vendor/leaflet/leaflet.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
